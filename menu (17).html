<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>قائمة الطعام | أنوار لبنان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --orange:#E07B0C;--orange-l:#F5A535;--orange-d:#B85E00;
  --brown:#3B1A05;--brown-m:#7A4820;--brown-l:#B07040;
  --cream:#F5EDE3;--cream-d:#EAD9C5;--cream-dd:#DEC8AC;
  --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Tajawal','Cairo',sans-serif;background:var(--cream);color:var(--brown)}

.view{display:none;min-height:100vh;flex-direction:column}
.view.active{display:flex}

/* ══ BACK TO MAIN ══ */
.main-back-bar{
  background:var(--brown);
  padding:10px 16px;
  display:flex;align-items:center;
  flex-shrink:0;
}
.main-back-btn{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.22);
  color:rgba(255,255,255,0.90);
  border-radius:30px;padding:6px 14px;
  font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;
  text-decoration:none;cursor:pointer;
  transition:background .2s;
}
.main-back-btn:hover{background:rgba(255,255,255,0.22);}

/* ══ HERO ══ */
.hero{
  position:relative;
  background-image:url('https://i.ibb.co/Wv9G1ypL/file-00000000edb4720a8d35b48caa71ad94.png');
  background-size:cover;
  background-position:center top;
  background-attachment:scroll;
  min-height:0;height:56vw;max-height:320px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0;overflow:hidden;
}

.hero-food-right{
  position:absolute;right:-12px;top:16px;
  width:145px;height:200px;object-fit:cover;
  object-position:center top;
  z-index:1;border-radius:0 0 0 60px;
}
.hero-food-left{
  position:absolute;left:-12px;top:32px;
  width:145px;height:185px;object-fit:cover;
  object-position:center top;
  z-index:1;border-radius:0 0 60px 0;
}

.hero-logo{
  position:relative;z-index:3;text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.hero-title{
  font-family:'Cairo',sans-serif;font-size:54px;font-weight:900;
  color:var(--brown);line-height:1;margin-top:6px;
  letter-spacing:-1px;
  text-shadow:0 2px 16px rgba(255,255,255,0.6);
}
.hero-sub{
  font-size:13px;color:var(--brown-m);font-weight:600;
  display:flex;align-items:center;gap:8px;margin-top:4px;
}
.hero-sub::before,.hero-sub::after{content:'—';color:var(--orange);opacity:0.7;}
.hero-ornament{color:var(--orange);font-size:20px;margin-top:6px;opacity:0.8;}

/* ══ HOME GRID ══ */
.home-body{background:var(--cream);flex:1;padding-bottom:8px;}

.home-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:14px;padding:14px 16px 24px;
  max-width:560px;margin:0 auto;width:100%;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}
.cat-card{animation:cardIn 0.5s ease both;}
.home-grid .cat-card:nth-child(1){animation-delay:0.05s;}
.home-grid .cat-card:nth-child(2){animation-delay:0.15s;}
.home-grid .cat-card:nth-child(3){animation-delay:0.25s;}
.home-grid .cat-card:nth-child(4){animation-delay:0.35s;}
.home-grid .cat-card:nth-child(5){animation-delay:0.45s;}

.cat-card{
  background:var(--white);border-radius:20px;
  box-shadow:0 4px 20px rgba(58,26,5,0.09);
  cursor:pointer;transition:transform .25s,box-shadow .25s;
  position:relative;overflow:visible;
}
.cat-card:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(58,26,5,0.14);}
.cat-card:active{transform:scale(0.97);}
.cat-card.wide{grid-column:1 / -1;}

.cat-img-wrap{
  border-radius:20px 20px 0 0;overflow:hidden;
  position:relative;aspect-ratio:1/0.65;
}
.cat-card.wide .cat-img-wrap{aspect-ratio:2.6/1;}

.cat-img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .4s ease;
}
.cat-card:hover .cat-img{transform:scale(1.07);}

.cat-img-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(58,26,5,0.25) 0%,transparent 60%);
}

.cat-body{padding:14px 14px 14px;text-align:center;}

.cat-name{
  font-family:'Cairo',sans-serif;font-size:16px;font-weight:800;
  color:var(--brown);margin-bottom:10px;line-height:1.2;
}

.cat-meta{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
}
.cat-arrow{
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--orange);color:var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;transition:background .2s,color .2s;
}
.cat-card:hover .cat-arrow{background:var(--orange);color:white;}
.cat-count{
  font-size:12px;color:var(--brown-m);flex:1;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.cat-count::before,.cat-count::after{
  content:'—';color:var(--orange-l);font-size:10px;opacity:0.7;
}

/* ══ INNER PAGE ══ */
.inner-header{
  position:sticky;top:0;z-index:200;
  background:var(--white);
  box-shadow:0 2px 16px rgba(58,26,5,0.07);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--cream);border:1.5px solid var(--cream-d);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;flex-shrink:0;
  transition:background .2s;color:var(--orange);
}
.back-btn:hover{background:var(--cream-d);}
.inner-title{font-family:'Cairo',sans-serif;font-size:19px;font-weight:800;color:var(--brown);flex:1;}
.inner-emoji{font-size:22px;}

.inner-banner-wrap{position:relative;overflow:hidden;height:165px;}
.inner-banner{width:100%;height:165px;object-fit:cover;display:block;}
.inner-banner-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(58,26,5,0.55) 0%,transparent 60%);
  display:flex;align-items:flex-end;padding:16px 18px;
}
.banner-tag{
  background:rgba(255,255,255,0.18);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.35);color:var(--white);
  font-size:13px;font-weight:600;padding:5px 14px;border-radius:20px;
}

.products-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:14px;padding:18px 14px 40px;
  max-width:600px;margin:0 auto;width:100%;
  background:var(--cream);
}

.prod-card{
  background:var(--white);border-radius:16px;overflow:hidden;
  box-shadow:0 3px 16px rgba(58,26,5,0.08);
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(20px);
  transition:opacity .4s ease,transform .4s ease,box-shadow .25s;
}
.prod-card.show{opacity:1;transform:none;}
.prod-card.show:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(58,26,5,0.13);}

.prod-card.wide{grid-column:1 / -1;flex-direction:row;align-items:stretch;}
.prod-card.wide .prod-img-wrap{width:140px;min-width:140px;aspect-ratio:auto;flex-shrink:0;}
.prod-card.wide .prod-img{height:100%;object-fit:cover;}
.prod-card.wide .prod-body{flex:1;padding:12px 14px;}
.prod-card.wide .prod-name{font-size:15px;font-weight:800;margin-bottom:8px;}

.prod-card.tall{grid-row:span 2;grid-column:2;}
.prod-card.tall .prod-img-wrap{aspect-ratio:3/4;}

.prod-img-wrap{position:relative;overflow:hidden;aspect-ratio:4/3;}
.prod-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
.prod-card:hover .prod-img{transform:scale(1.08);}

.prod-badge{
  position:absolute;top:8px;right:8px;
  background:linear-gradient(135deg,var(--orange),var(--orange-l));
  color:white;font-family:'Cairo',sans-serif;
  font-size:12px;font-weight:900;padding:4px 9px;border-radius:20px;
  box-shadow:0 3px 10px rgba(224,123,12,0.4);
}
.prod-badge.no-price{background:linear-gradient(135deg,#999,#bbb);}

.prod-body{padding:10px 11px 12px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.prod-name{font-size:13.5px;font-weight:700;color:var(--brown);line-height:1.35;margin-bottom:6px;}
.prod-note{font-size:11px;color:var(--brown-l);margin-bottom:4px;font-style:italic;}
.prod-flavors{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.prod-flavor-chip{
  background:var(--cream);border:1px solid var(--cream-d);
  color:var(--brown-m);font-size:10.5px;padding:2px 7px;border-radius:8px;
}
.prod-sizes{display:flex;gap:5px;margin-bottom:6px;}
.prod-size-chip{
  background:linear-gradient(135deg,var(--orange-d),var(--orange));
  color:white;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px;
}
.prod-price-row{display:flex;align-items:center;justify-content:space-between;}
.prod-price{font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;color:var(--orange);}
.prod-price.dash{color:#bbb;font-size:18px;letter-spacing:1px;}
.prod-currency{font-size:10px;font-weight:600;color:var(--brown-l);margin-right:2px;}
.prod-heart{
  width:28px;height:28px;border-radius:50%;
  background:var(--cream);border:1px solid var(--cream-d);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;transition:transform .2s;
}
.prod-heart:hover{transform:scale(1.2);}

.manaesh-types{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.manaesh-chip{
  background:var(--cream);border:1px solid var(--cream-d);
  color:var(--brown-m);font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:10px;white-space:nowrap;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.cat-card{animation:fadeUp .5s ease both;}
.cat-card:nth-child(1){animation-delay:.05s}
.cat-card:nth-child(2){animation-delay:.12s}
.cat-card:nth-child(3){animation-delay:.19s}
.cat-card:nth-child(4){animation-delay:.26s}
.cat-card:nth-child(5){animation-delay:.33s}

@media(max-width:400px){
  .home-grid{gap:12px;padding:14px 12px 8px;}
  .hero-food-left,.hero-food-right{width:125px;}
  .hero-title{font-size:46px;}
}
</style>

    banner:'https://i.ibb.co/605H2RvF/file-0000000046c072468e8ffdc10da83e64.png',
    tag:'بيتزا طازجة من الفرن',
    items:[
      {name:'بيتزا',           img:'https://i.ibb.co/gLPC7qY6/FB-IMG-1779783336509.jpg',
        flavors:['دجاج','لحم','ميكس لحوم','نقانق + جبن','خضار']},
      {name:'بيتزا مكس أجبان', img:'https://i.ibb.co/BK7szGvk/FB-IMG-1779783464447.jpg',
        flavors:['حلوم + موزاريلا + كرافت']},
      {name:'بيتزا ميني',      img:'https://i.ibb.co/PsHgCS9W/FB-IMG-1779783052148.jpg'},
      {name:'بيتزا وسط',       img:'https://i.ibb.co/KcQ3vtqv/FB-IMG-1779783106733.jpg'},
    ]
  }
};

const fallbackImg = 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&q=80';

function buildPriceHTML(item){
  if(item.price !== undefined)
    return `<div class="prod-price"><span class="prod-currency">AED </span>${item.price}</div>`;
  return `<div class="prod-price dash">—</div>`;
}
function buildBadgeHTML(item){
  if(item.price !== undefined)
    return `<div class="prod-badge">${item.price} AED</div>`;
  return `<div class="prod-badge no-price">—</div>`;
}

function openCategory(key){
  const cat = categories[key];
  document.getElementById('inner-emoji').textContent = cat.emoji;
  document.getElementById('inner-title').textContent = cat.name;
  document.getElementById('inner-banner').src = cat.banner;
  document.getElementById('inner-tag').textContent = cat.tag;
  const grid = document.getElementById('products-grid');
  grid.innerHTML = '';
  cat.items.forEach((item,i)=>{
    const card = document.createElement('div');
    card.className = 'prod-card'+(item.wide?' wide':'')+(item.tall?' tall':'');
    let extras = '';
    if(item.sizes)
      extras += `<div class="prod-sizes">${item.sizes.map(s=>`<span class="prod-size-chip">${s}</span>`).join('')}</div>`;
    if(item.flavors)
      extras += `<div class="prod-flavors">${item.flavors.map(f=>`<span class="prod-flavor-chip">${f}</span>`).join('')}</div>`;
    if(item.note)
      extras += `<div class="prod-note">${item.note}</div>`;
    let manaesh = '';
    if(item.manaeshTypes)
      manaesh = `<div class="manaesh-types">${item.manaeshTypes.map(t=>`<span class="manaesh-chip">${t}</span>`).join('')}</div>`;
    card.innerHTML=`
      <div class="prod-img-wrap">
        <img class="prod-img" src="${item.img}" alt="${item.name}" loading="lazy"
          onerror="this.src='${fallbackImg}'"/>
        ${buildBadgeHTML(item)}
      </div>
      <div class="prod-body">
        <div>
          <div class="prod-name">${item.name}</div>
          ${extras}${manaesh}
        </div>
        <div class="prod-price-row">
          ${buildPriceHTML(item)}
          <div class="prod-heart">🤍</div>
        </div>
      </div>`;
    grid.appendChild(card);
    setTimeout(()=>card.classList.add('show'), 60+i*55);
  });
  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-inner').classList.add('active');
  window.scrollTo(0,0);
}

function goHome(){
  document.getElementById('view-inner').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  window.scrollTo(0,0);
}
</script>
